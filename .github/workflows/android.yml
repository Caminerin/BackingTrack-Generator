name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        run: |
          echo "----- grepped errors -----"
          grep -nE "^e: |error: |: error:|FAILURE:|What went wrong|Caused by:|Unresolved reference|> Task .* FAILED" build.log | head -120 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          echo "----- tail of build.log -----"
          tail -150 build.log

      - name: Lint
        run: ./gradlew lintDebug --stacktrace || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BackingTrackGenerator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
